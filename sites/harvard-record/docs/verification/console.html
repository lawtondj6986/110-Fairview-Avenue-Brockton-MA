*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}

.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;border:1.5px solid var(--muted);margin-right:.4rem;vertical-align:middle}
.dot.part{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent)}.dot.done{background:var(--ok);border-color:var(--ok)}.dot.chg{background:var(--accent);border-color:var(--accent);border-radius:2px}

.tag{display:inline-block;font-size:.72rem;font-weight:700;border:1px solid var(--ink);border-radius:3px;padding:0 .3rem;margin-right:.4rem}

.choices{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.9rem;margin-top:.4rem}
textarea{width:100%;font:inherit;font-size:.9rem;margin-top:.4rem;padding:.4rem;border:1px solid var(--rule);border-radius:4px;min-height:3.2rem}
.warn{background:#fff8e6;border:1px solid #e3cf9a;border-radius:4px;padding:.6rem .8rem;font-size:.88rem;margin:.6rem 0}
.gate label{display:block;margin:.3rem 0}
input[type=url]{width:100%;font:inherit;padding:.35rem .5rem;border:1px solid var(--rule);border-radius:4px}
@media(max-width:52rem){main{grid-template-columns:1fr}nav{position:static;max-height:14rem;border-right:0;border-bottom:1px solid var(--rule)}}

<script>const GENERATED="2026-11-24";const MODEL=[{"id":"harvard-2020-report","title":"Report Concerning Jeffrey E. Epstein’s Connections to Harvard University","publisher":"Harvard University, Office of the General Counsel","author":"","date":"2020-05-01","url":"https://ogc.harvard.edu/sites/g/files/omnuum12481/files/ogc/files/report_concerning_jeffrey_e._epsteins_connections_to_harvard_university.pdf","grade":"A1","note":"Harvard’s own account. It is the primary record for gifts, campus access and the Program for Evolutionary Dynamics.","checked":"","namesPeople":true,"claims":[{"key":"F-01","text":"Epstein’s gifts to Harvard totalled about $9.1 million between 1998 and 2008.","state":"Verified implementation","grade":"A1","caveat":"University-wide total. Some coverage gives $9,179,000 or “nearly $9.2 million”, which is more than rounding; confirm in the report.","also":["bacow-2020"]},{"key":"F-02","text":"A $6.5 million gift in 2003 established the Program for Evolutionary Dynamics.","state":"Verified implementation","grade":"A1","caveat":"","also":["hm-2020-report"]},{"key":"F-03","text":"Harvard accepted no gifts from Epstein after his 2008 conviction.","state":"Verified implementation","grade":"A1","caveat":"The decision was made by the President in 2008 and was not formally recorded at the time.","also":[]},{"key":"F-06","text":"Before 2008, Epstein’s foundation gave $686,000 to support George Church’s research.","state":"Verified implementation","grade":"A1","caveat":"The figure is attributed to a footnote of the report and must be confirmed in the PDF.","also":["stat-2019-church"]},{"key":"A-01","text":"Epstein visited the Program’s offices more than 40 times between 2010 and 2018.","state":"Verified implementation","grade":"A1","caveat":"An estimate. The report says the records do not allow a precise count.","also":[]},{"key":"A-02","text":"He held a visitor key card, the door passcode and a key to an office.","state":"Verified implementation","grade":"A1","caveat":"","also":[]},{"key":"A-03","text":"The Program informally called one office “Jeffrey’s Office.”","state":"Verified implementation","grade":"A1","caveat":"The Program’s director told reviewers that other visitors also used the room.","also":[]},{"key":"A-04","text":"The Program’s website linked to Epstein’s foundation sites from 2013 and carried a page about him in 2014.","state":"Verified implementation","grade":"A1","caveat":"The page was removed in 2014 after a complaint.","also":[]},{"key":"A-05","text":"Epstein was a Visiting Fellow in the Department of Psychology in 2005–06.","state":"Verified implementation","grade":"A1","caveat":"","also":[]},{"key":"A-06","text":"The review did not find evidence that he engaged with undergraduate students during visits or as a Visiting Fellow.","state":"Verified implementation","grade":"A1","caveat":"Limited to undergraduates and to what the review could find. Reporting notes he attended one undergraduate class.","also":[]},{"key":"A-08","text":"The Program’s offices were in a private building at One Brattle Square.","state":"Verified implementation","grade":"A1","caveat":"","also":[]},{"key":"R-02","text":"The General Counsel’s report was published on 1 May 2020 and Martin Nowak was placed on paid administrative leave.","state":"Verified implementation","grade":"A1","caveat":"","also":["bacow-2020"]},{"key":"D-01","text":"Between 2010 and 2015, donors Epstein had introduced gave $7.5 million for Martin Nowak’s work.","state":"Verified implementation","grade":"A1","caveat":"","also":[]},{"key":"D-02","text":"In the same period, introduced donors gave $2 million for George Church’s work.","state":"Verified implementation","grade":"A1","caveat":"","also":[]},{"key":"D-03","text":"The donors denied that Epstein directed their gifts, and the review found no evidence that he did.","state":"Verified implementation","grade":"A1","caveat":"","also":["crimson-2020-report"]},{"key":"S-14","text":"No source reviewed documents an assault or harassment complaint at Harvard arising from Epstein’s campus visits.","state":"Nothing on record","grade":"A1","caveat":"A statement of absence across the sources reviewed.","also":[]}],"statements":[{"key":"s1itybq2","where":"/campus-safety/","text":"Harvard’s 2020 review of Epstein’s access said it “did not find evidence” that he engaged with undergraduate students during his campus visits or as a Visiting Fellow. That statement is limited to undergraduates and to what the review could establish. No source reviewed here documents an assault or harassment complaint at Harvard arising from his visits."},{"key":"sr2roaa","where":"/donor-pathways/","text":"Direct gift from Epstein None accepted. The total of $9.1 million was all received between 1998 and 2008."},{"key":"s1455jpj","where":"/donor-pathways/","text":"Gift from a donor he introduced $7.5 million for Professor Nowak’s work and $2 million for Professor Church’s, 2010 to 2015."},{"key":"spytjid","where":"/donor-pathways/","text":"Non-financial standing Key card, office use and website presence at one program; meetings with faculty."},{"key":"ss6fxhs","where":"/donor-pathways/","text":"The review recorded that the introduced donors denied Epstein had directed their gifts, and it found no evidence that he had. It also noted that his staff acted as intermediaries on some of them. An introduction is therefore documented. Direction of the money is not."},{"key":"s1x8esro","where":"/harvard-medical-school/","text":"Harvard’s 2020 report records that donors Epstein had introduced gave $2 million for Professor Church’s work between 2010 and 2015. Documents released by the Justice Department in 2026 added three things: Epstein had been enrolled as a research subject, a 2013 attempt to prioritise his sample caused a dispute inside the lab, and a physician colleague sent him a priced list of genetic services in 2014."},{"key":"s1iylfpe","where":"/","text":"$9.1M Epstein gifts to Harvard, 1998 to 2008"},{"key":"s14n9z42","where":"/","text":"$0 Gifts Harvard accepted from him after the 2008 conviction"},{"key":"srrn6zs","where":"/","text":"40+ Visits to one research program’s offices, 2010 to 2018"},{"key":"sicowur","where":"/","text":"$9.5M Given by donors he introduced, 2010 to 2015"},{"key":"s1xptumz","where":"/","text":"Jeffrey Epstein was convicted in Florida in 2008. Harvard stopped taking his money that year. Its own 2020 review found that he nonetheless kept physical access to a research program he had funded, visited it dozens of times, and introduced other donors whose gifts reached the same faculty. A large Department of Justice document release in early 2026 added detail and prompted Harvard to reopen and widen its review."},{"key":"s13s70xw","where":"/program-for-evolutionary-dynamics/","text":"$6.5M Founding gift, 2003"},{"key":"s1btk68q","where":"/program-for-evolutionary-dynamics/","text":"40+ Visits to the Program’s offices, 2010 to 2018"},{"key":"sun3mwt","where":"/program-for-evolutionary-dynamics/","text":"$7.5M From introduced donors for Professor Nowak’s work, 2010 to 2015"},{"key":"sr9rfhb","where":"/program-for-evolutionary-dynamics/","text":"The Program for Evolutionary Dynamics was a mathematical biology group led by Professor Martin Nowak. It was established with a $6.5 million gift from Epstein in 2003 and worked from a private office building at One Brattle Square in Harvard Square."},{"key":"s1aeupxe","where":"/program-for-evolutionary-dynamics/","text":"Harvard’s review counted $9.1 million in gifts from Epstein to the whole University between 1998 and 2008. After his 2008 conviction, President Drew Faust decided that Harvard would accept nothing further from him, and the review found that it did not. The Program is where the relationship continued in other forms: physical access, a presence on the Program’s website, and gifts from donors he had introduced."},{"key":"scba3o6","where":"/program-for-evolutionary-dynamics/","text":"Harvard’s review describes four things."},{"key":"s1hh5omr","where":"/program-for-evolutionary-dynamics/","text":"The review said he used the visits mainly to meet prominent academics from the Cambridge area. It reported that it “did not find evidence” that he engaged with undergraduate students during the visits or as a Visiting Fellow. That sentence is limited to undergraduates and to what the review could find. The Crimson’s account of the report notes that he attended one of Professor Nowak’s undergraduate classes."},{"key":"s1n5g81a","where":"/program-for-evolutionary-dynamics/","text":"2008 No further gifts accepted from Epstein"},{"key":"shdgakj","where":"/program-for-evolutionary-dynamics/","text":"2010 to 2018 Physical access to the Program continued; the review found no evidence that University leadership knew of the website page"},{"key":"s9t1wml","where":"/program-for-evolutionary-dynamics/ (Timeline: 1998 to 2008)","text":"Gifts to Harvard total about $9.1 million. Harvard’s review counted $9.1 million in gifts from Epstein to the University across this decade. This is the figure for all of Harvard, not for the Program alone."},{"key":"s1es0q4b","where":"/program-for-evolutionary-dynamics/ (Timeline: 2003)","text":"A $6.5 million gift establishes the Program. The largest single gift, $6.5 million, founded the Program for Evolutionary Dynamics under Professor Martin Nowak. Its offices were in a private building at One Brattle Square, Harvard Square."},{"key":"s5501os","where":"/program-for-evolutionary-dynamics/ (Timeline: 2005 to 2006)","text":"Visiting Fellow in the Department of Psychology. Epstein was admitted as a Visiting Fellow for 2005–06. The report says he lacked the academic qualifications Visiting Fellows typically have. He was readmitted for 2006–07 and withdrew after his arrest."},{"key":"s1u92esh","where":"/program-for-evolutionary-dynamics/ (Timeline: 2008)","text":"Florida conviction; Harvard stops accepting his gifts. After Epstein’s 2008 conviction, President Drew Faust decided Harvard would accept no further gifts from him. The review found none were received after that point. A faculty request to revisit the decision was declined in 2013."},{"key":"s1ivfphj","where":"/program-for-evolutionary-dynamics/ (Timeline: 2010 to 2018)","text":"More than 40 visits; key card, passcode and office key. Harvard’s review could not fix an exact number but understood that Epstein visited the Program’s offices more than 40 times in this period, at least once as late as October 2018. He held a visitor key card, the door passcode and a key to an office the Program informally called “Jeffrey’s Office.” Professor Nowak told reviewers the office was also used by other visitors."},{"key":"spdaxll","where":"/program-for-evolutionary-dynamics/ (Timeline: 2010 to 2015)","text":"Introduced donors give $7.5 million for Nowak’s work. Donors whom Epstein had introduced gave $7.5 million to support Professor Nowak’s work and $2 million to support Professor George Church’s. The donors denied that Epstein directed their gifts, and the review found no evidence that he did."},{"key":"s106qr4q","where":"/program-for-evolutionary-dynamics/ (Timeline: 2013 to 2014)","text":"Program website links to, then features, Epstein. At the request of Epstein’s publicist, the Program’s website linked to his foundation’s sites and, in 2014, carried a page about him. Professor Nowak approved both. The page came down in 2014 after a complaint from a sexual assault survivors’ group."},{"key":"s1qcytxz","where":"/program-for-evolutionary-dynamics/ (Timeline: 1 May 2020)","text":"Report published; Nowak placed on paid leave. The General Counsel’s report was released. Professor Nowak was placed on paid administrative leave pending a Faculty of Arts and Sciences review. The unspent balance of Epstein’s gifts, $200,937, was divided between two organisations that support survivors of trafficking and sexual assault."},{"key":"sp69y9m","where":"/harvard-medical-school/ (Timeline: 2005 to 2007)","text":"Direct gifts to the Church laboratory. Before the 2008 conviction, Epstein’s foundation supported Professor George Church’s research. Harvard’s report is cited for a total of $686,000."},{"key":"s1v0bdo3","where":"/harvard-medical-school/ (Timeline: 2010 to 2015)","text":"$2 million from introduced donors. Harvard’s report records $2 million for Professor Church’s work from donors Epstein had introduced. The donors denied that he directed the gifts."},{"key":"s16ydiib","where":"/comparison/ (Funding before the 2008 conviction; Harvard)","text":"$6.5 million founding gift in 2003, within $9.1 million to Harvard overall."},{"key":"stra32y","where":"/comparison/ (Funding before the 2008 conviction; Harvard Medical School)","text":"Foundation support for the Church lab, 2005 to 2007."},{"key":"s57k2pm","where":"/comparison/ (Direct funding after the conviction; Harvard)","text":"None. Harvard accepted no gifts from him after 2008."},{"key":"s7mq6ew","where":"/comparison/ (Funding from introduced donors; Harvard)","text":"$7.5 million for Professor Nowak’s work, 2010 to 2015."},{"key":"s1g6lrfx","where":"/comparison/ (Funding from introduced donors; Harvard Medical School)","text":"$2 million for Professor Church’s work, 2010 to 2015."},{"key":"syvubvc","where":"/comparison/ (Access mechanism; Harvard)","text":"Key card, passcode and office key; more than 40 visits, 2010 to 2018."},{"key":"s1kfchwg","where":"/comparison/ (Who inside the institution knew; Harvard)","text":"The program’s director. The review found no evidence that University leadership knew of the website page."},{"key":"sx5qvge","where":"/comparison/ (Primary source; Harvard)","text":"Harvard General Counsel report, 2020."}],"weight":86},{"id":"cnn-2026-thakuria","title":"Epstein paid for novel genetic testing in apparent effort to explore extending life, new emails show","publisher":"CNN","author":"","date":"2026-02-06","url":"https://www.cnn.com/2026/02/06/politics/jeffrey-epstein-genetic-test-joseph-thakuria-harvard","grade":"A2","note":"Reports the June 2014 invoice from the Department of Justice release and carries statements from Joseph Thakuria, Harvard and Massachusetts General Hospital.","checked":"","namesPeople":true,"claims":[{"key":"G-03","text":"A June 2014 invoice from Joseph Thakuria listed an initial $2,000: $1,000 for exome sequencing and $1,000 for fibroblast sequencing.","state":"Documented activity","grade":"A2","caveat":"Payment rests on his statement that a $2,000 cheque was provided.","also":[]},{"key":"G-04","text":"The same invoice priced further work to a total of $193,400, including a $160,000 item called “The Venus Project.”","state":"Stated intent","grade":"A2","caveat":"No record of payment or performance. He described the idea as preliminary and unfunded.","also":[]},{"key":"G-05","text":"Joseph Thakuria was a physician at Massachusetts General Hospital and was not directly employed by Harvard.","state":"Verified implementation","grade":"A2","caveat":"The hospital says it has no record of approving the studies described. No wrongdoing is alleged.","also":[]},{"key":"G-10","text":"No public record shows a shared genetic database, a research output or an operational programme connecting these items.","state":"Nothing on record","grade":"A2","caveat":"A statement of absence across the sources reviewed.","also":["nypost-2026-kits"]}],"statements":[{"key":"s1ohu1ce","where":"/dna-genetics/","text":"Exome and fibroblast sequencing June 2014 A $2,000 initial charge on an invoice from Dr Joseph Thakuria, who says a cheque for that amount was paid."},{"key":"s1n8vztc","where":"/dna-genetics/","text":"Stem-cell, gene-editing and “Venus” proposals June 2014 Priced on the same invoice, to a total of $193,400. No record of payment or performance."},{"key":"s5ka7tk","where":"/dna-genetics/","text":"The only place the record shows genetic analysis of Epstein’s own material is the June 2014 invoice. Two items, $1,000 each, covered sequencing of his exome and of stored fibroblasts. The Harvard Medical School page sets out the full invoice and the statements of those involved."},{"key":"s1x8esro","where":"/harvard-medical-school/","text":"Harvard’s 2020 report records that donors Epstein had introduced gave $2 million for Professor Church’s work between 2010 and 2015. Documents released by the Justice Department in 2026 added three things: Epstein had been enrolled as a research subject, a 2013 attempt to prioritise his sample caused a dispute inside the lab, and a physician colleague sent him a priced list of genetic services in 2014."},{"key":"shv7l4a","where":"/harvard-medical-school/","text":"Dr Joseph Thakuria was then a senior physician at Massachusetts General Hospital and a colleague of Professor Church. A Harvard representative told CNN he was not directly employed by Harvard or its Wyss Institute. He said Professor Church introduced Epstein to him as a potential Personal Genome Project research subject."},{"key":"s132xy0u","where":"/harvard-medical-school/","text":"Exome sequencing from a saliva sample $1,000 Part of the initial $2,000. Dr Thakuria told CNN a $2,000 cheque covered DNA sequencing."},{"key":"s1qatsqm","where":"/harvard-medical-school/","text":"Sequencing of fibroblasts already in storage $1,000 The second half of the initial $2,000."},{"key":"s16z1vad","where":"/harvard-medical-school/","text":"Stem-cell line creation From $10,000 Priced on the invoice. CNN found no record of payment."},{"key":"sw8szhs","where":"/harvard-medical-school/","text":"“Personalized longevity studies” using gene editing Priced A proposal to use gene editing on cells. No record that it was funded or performed."},{"key":"scu3ps7","where":"/harvard-medical-school/","text":"“The Venus Project” $160,000 The largest single item. Dr Thakuria called it a preliminary idea of Epstein’s that “never went anywhere” and was never funded."},{"key":"s2v0t69","where":"/harvard-medical-school/","text":"All proposed work together $193,400 The total had everything been commissioned. Only the first $2,000 is supported by any statement of payment."},{"key":"s1y9jqbu","where":"/harvard-medical-school/","text":"Massachusetts General Hospital said it has no record of approving Dr Thakuria for the studies described in the emails, and that he left the hospital in 2022. Neither he nor Professor Church is accused of wrongdoing in the reporting."},{"key":"sid6l8a","where":"/harvard-medical-school/ (Timeline: June 2014)","text":"The Thakuria invoice. Dr Joseph Thakuria, then a physician at Massachusetts General Hospital, sent an invoice with an initial $2,000: $1,000 to sequence the exome and $1,000 to sequence fibroblasts. The same document priced further work that the record does not show was done."},{"key":"sqvxze9","where":"/harvard-medical-school/ (Timeline: February to March 2026)","text":"Document release and new reporting. CNN, STAT and the Boston Globe reported on emails in the Justice Department release. Harvard’s widened review covers faculty named in the documents. No disciplinary finding concerning Professor Church or Dr Thakuria was located."},{"key":"sj89fv3","where":"/comparison/ (Direct funding after the conviction; Harvard Medical School)","text":"None to Harvard. A $2,000 payment for sequencing, by a physician’s account."},{"key":"s73j2s0","where":"/comparison/ (Access mechanism; Harvard Medical School)","text":"Faculty contact and enrolment as a research subject."},{"key":"s1mqwl3o","where":"/comparison/ (DNA activity; Harvard Medical School)","text":"Cell lines derived in 2013; exome and fibroblast sequencing invoiced in 2014. Larger proposals not carried out."},{"key":"s96sle5","where":"/comparison/ (Primary source; Harvard Medical School)","text":"Justice Department release, as reported by CNN and STAT."}],"weight":30},{"id":"mit-2020-report","title":"Report Concerning Jeffrey Epstein’s Interactions with the Massachusetts Institute of Technology (MIT News release and report)","publisher":"Goodwin Procter LLP for the MIT Corporation","author":"","date":"2020-01-10","url":"https://news.mit.edu/2020/mit-releases-results-fact-finding-report-jeffrey-epstein-0110","grade":"A1","note":"MIT’s commissioned fact-finding report. The link is to MIT’s release, which carries the report.","checked":"","namesPeople":true,"claims":[{"key":"M-01","text":"MIT received ten gifts from Epstein totalling $850,000 between 2002 and 2017.","state":"Verified implementation","grade":"A1","caveat":"","also":[]},{"key":"M-02","text":"Nine of the gifts came after the 2008 conviction: $525,000 to the Media Lab and $225,000 to Seth Lloyd.","state":"Verified implementation","grade":"A1","caveat":"","also":[]},{"key":"M-03","text":"Three vice-presidents learned of the gifts in 2013 and allowed them to continue on informal conditions, including anonymity.","state":"Verified implementation","grade":"A1","caveat":"","also":["techreview-2020-mit"]},{"key":"M-04","text":"Epstein visited the MIT campus nine times between 2013 and 2017.","state":"Verified implementation","grade":"A1","caveat":"","also":[]}],"statements":[{"key":"sgo0pz3","where":"/donor-pathways/","text":"MIT’s commissioned review, by the law firm Goodwin Procter, found a different route to a similar end. MIT did take Epstein’s money after his conviction: of ten gifts totalling $850,000 between 2002 and 2017, nine came after 2008, $525,000 to the Media Lab and $225,000 to Professor Seth Lloyd. Three vice-presidents learned of the gifts in 2013 and allowed them to continue on informal conditions, including anonymity. He visited the campus nine times between 2013 and 2017."},{"key":"sel9hr4","where":"/comparison/ (Funding before the 2008 conviction; MIT)","text":"One gift of $100,000 in 2002."},{"key":"sl6h8tp","where":"/comparison/ (Direct funding after the conviction; MIT)","text":"Nine gifts: $525,000 to the Media Lab and $225,000 to Professor Seth Lloyd."},{"key":"s19khaf8","where":"/comparison/ (Access mechanism; MIT)","text":"Nine campus visits as a guest, 2013 to 2017."},{"key":"sc89s4d","where":"/comparison/ (Who inside the institution knew; MIT)","text":"The lab’s director and, from 2013, three vice-presidents."},{"key":"s1oeu7d2","where":"/comparison/ (Primary source; MIT)","text":"Goodwin Procter report for MIT, 2020."}],"weight":18},{"id":"bacow-2020","title":"Report regarding Jeffrey Epstein’s connections to Harvard","publisher":"Harvard University, Office of the President","author":"Lawrence S. Bacow","date":"2020-05-01","url":"https://www.harvard.edu/president/news/2020/report-regarding-jeffrey-epstein-s-connections-to-harvard","grade":"A1","note":"The President’s message releasing the report and describing the steps taken.","checked":"","namesPeople":true,"claims":[{"key":"F-01","text":"Epstein’s gifts to Harvard totalled about $9.1 million between 1998 and 2008.","state":"Verified implementation","grade":"A1","caveat":"University-wide total. Some coverage gives $9,179,000 or “nearly $9.2 million”, which is more than rounding; confirm in the report.","also":["harvard-2020-report"]},{"key":"F-05","text":"The unspent balance of Epstein’s gifts, $200,937, was given to two organisations supporting survivors.","state":"Verified implementation","grade":"A1","caveat":"","also":[]},{"key":"R-01","text":"Harvard’s President announced a review of Epstein’s connections in September 2019.","state":"Verified implementation","grade":"A1","caveat":"","also":[]},{"key":"R-02","text":"The General Counsel’s report was published on 1 May 2020 and Martin Nowak was placed on paid administrative leave.","state":"Verified implementation","grade":"A1","caveat":"","also":["harvard-2020-report"]}],"statements":[{"key":"sfyhdpd","where":"/donor-pathways/","text":"For a prospective student or an alumnus, the useful question is how a university’s controls work in practice. In both cases a central rule or decision existed, and the relationship continued at the level of an individual laboratory. Harvard’s review responded by recommending clearer gift policies and donor vetting. Whether those changes are sufficient is a judgement this site leaves to the reader."},{"key":"sbf0j87","where":"/program-for-evolutionary-dynamics/","text":"May 2020 Report published; Professor Nowak placed on paid leave; unspent $200,937 redirected to survivor organisations"},{"key":"s9t1wml","where":"/program-for-evolutionary-dynamics/ (Timeline: 1998 to 2008)","text":"Gifts to Harvard total about $9.1 million. Harvard’s review counted $9.1 million in gifts from Epstein to the University across this decade. This is the figure for all of Harvard, not for the Program alone."},{"key":"s1a1bm0l","where":"/program-for-evolutionary-dynamics/ (Timeline: 12 September 2019)","text":"Harvard opens its review. After Epstein’s July 2019 arrest and his death that August, President Lawrence Bacow announced a review of his connections to the University."},{"key":"s1qcytxz","where":"/program-for-evolutionary-dynamics/ (Timeline: 1 May 2020)","text":"Report published; Nowak placed on paid leave. The General Counsel’s report was released. Professor Nowak was placed on paid administrative leave pending a Faculty of Arts and Sciences review. The unspent balance of Epstein’s gifts, $200,937, was divided between two organisations that support survivors of trafficking and sexual assault."}],"weight":17},{"id":"nypost-2026-kits","title":"Epstein sent DNA test kits to Noam Chomsky and Woody Allen, newly released DOJ files show","publisher":"New York Post (syndicated by AOL)","author":"Samuel Chamberlain","date":"2026-01","url":"https://www.aol.com/articles/epstein-sent-dna-test-kits-200400562.html","grade":"A2","note":"Quotes emails from the Department of Justice release. The underlying emails are the primary record.","checked":"","namesPeople":true,"claims":[{"key":"G-06","text":"In September 2016 Epstein was told 23andMe kits had arrived for delivery to Woody Allen and Soon-Yi Previn.","state":"Documented activity","grade":"A2","caveat":"Receiving a kit implies nothing about the recipient.","also":[]},{"key":"G-07","text":"In April 2017 Karyna Shuliak asked for two 23andMe kits to be sent to Noam and Valeria Chomsky; two kits bought on Amazon were shipped.","state":"Documented activity","grade":"A2","caveat":"Receiving a kit implies nothing about the recipient. No research use is described.","also":[]},{"key":"G-10","text":"No public record shows a shared genetic database, a research output or an operational programme connecting these items.","state":"Nothing on record","grade":"A2","caveat":"A statement of absence across the sources reviewed.","also":["cnn-2026-thakuria"]}],"statements":[{"key":"s64jk35","where":"/dna-genetics/","text":"23andMe kits for Woody Allen and Soon-Yi Previn September 2016 An email says kits arrived and would be delivered. Epstein replied “great.”"},{"key":"srdtb4i","where":"/dna-genetics/","text":"23andMe kits for Noam and Valeria Chomsky April 2017 A request from Karyna Shuliak; two kits bought on Amazon and shipped."},{"key":"s1hq39xf","where":"/dna-genetics/","text":"“Jeffrey would like to send 2 genetic kits from 23 and me to Noam and Valeria Chomsky, please. Could you please arrange that? I believe we have extra kits in the oval room closet, right?”"},{"key":"s1z0amg1","where":"/dna-genetics/","text":"The reply said two kits bought on Amazon had been shipped. An accountant, Bella Klein, asked that Epstein’s email be kept as backup for reimbursement."}],"weight":13},{"id":"stat-2019-church","title":"Citing “nerd tunnel vision,” biologist George Church apologizes for contacts with Jeffrey Epstein","publisher":"STAT","author":"","date":"2019-08-05","url":"https://www.statnews.com/2019/08/05/citing-nerd-tunnel-vision-biologist-george-church-apologizes-for-contacts-with-jeffrey-epstein/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"F-06","text":"Before 2008, Epstein’s foundation gave $686,000 to support George Church’s research.","state":"Verified implementation","grade":"A1","caveat":"The figure is attributed to a footnote of the report and must be confirmed in the PDF.","also":["harvard-2020-report"]},{"key":"R-09","text":"George Church publicly apologised in August 2019 for contact with Epstein after the conviction.","state":"Verified implementation","grade":"A2","caveat":"","also":[]}],"statements":[{"key":"s11id69n","where":"/harvard-medical-school/","text":"Professor George Church leads a genetics laboratory at Harvard Medical School and founded the Personal Genome Project, a study in which volunteers share their genomes and tissue for research. Epstein’s foundation supported his lab before the 2008 conviction, and Professor Church stayed in contact afterward. He apologised publicly for that in 2019."},{"key":"sp69y9m","where":"/harvard-medical-school/ (Timeline: 2005 to 2007)","text":"Direct gifts to the Church laboratory. Before the 2008 conviction, Epstein’s foundation supported Professor George Church’s research. Harvard’s report is cited for a total of $686,000."},{"key":"sqyr1aq","where":"/harvard-medical-school/ (Timeline: August 2019)","text":"Church apologises for continued contact. Professor Church publicly apologised for his contacts with Epstein after the 2008 conviction."},{"key":"stra32y","where":"/comparison/ (Funding before the 2008 conviction; Harvard Medical School)","text":"Foundation support for the Church lab, 2005 to 2007."},{"key":"s1ysgz3k","where":"/comparison/ (Institutional response; Harvard Medical School)","text":"Public apology by Professor Church in 2019; covered by Harvard’s widened 2026 review; no finding published."}],"weight":11},{"id":"stat-2026-tissue","title":"Jeffrey Epstein’s tissue samples ignited a furor in the Harvard lab of George Church","publisher":"STAT","author":"","date":"2026-02-24","url":"https://www.statnews.com/2026/02/24/epstein-cell-line-george-church-harvard-personal-genome-project/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"G-01","text":"In 2013 an attempt to prioritise Epstein’s tissue sample caused a dispute in the Church lab, and objections stopped special treatment.","state":"Documented activity","grade":"A2","caveat":"George Church confirmed the episode and said he had not personally pressed for priority.","also":[]}],"statements":[{"key":"s1x8esro","where":"/harvard-medical-school/","text":"Harvard’s 2020 report records that donors Epstein had introduced gave $2 million for Professor Church’s work between 2010 and 2015. Documents released by the Justice Department in 2026 added three things: Epstein had been enrolled as a research subject, a 2013 attempt to prioritise his sample caused a dispute inside the lab, and a physician colleague sent him a priced list of genetic services in 2014."},{"key":"ss51gsc","where":"/harvard-medical-school/","text":"STAT reported that in 2013 there was a push in the Church lab to move one person’s tissue sample ahead of samples that had waited years for sequencing. When lab members learned whose it was, they objected, and the objections stopped any special treatment. Professor Church confirmed the episode, said he had not personally pressed for priority, and said he “made the wrong call” on conflicting information."},{"key":"sytca56","where":"/harvard-medical-school/ (Timeline: 2013)","text":"Tissue sample and a dispute in the lab. STAT reported that a push to move one person’s sample ahead of others waiting for sequencing caused an uproar in the Church lab when the person was identified as Epstein, and that internal objections stopped any special treatment. Cell lines were derived from the sample that year. Professor Church confirmed the episode and said he had not personally pushed for special treatment."},{"key":"sqvxze9","where":"/harvard-medical-school/ (Timeline: February to March 2026)","text":"Document release and new reporting. CNN, STAT and the Boston Globe reported on emails in the Justice Department release. Harvard’s widened review covers faculty named in the documents. No disciplinary finding concerning Professor Church or Dr Thakuria was located."},{"key":"s73j2s0","where":"/comparison/ (Access mechanism; Harvard Medical School)","text":"Faculty contact and enrolment as a research subject."},{"key":"snf4mti","where":"/comparison/ (Who inside the institution knew; Harvard Medical School)","text":"Lab members objected in 2013 when the sample’s source became known."},{"key":"s96sle5","where":"/comparison/ (Primary source; Harvard Medical School)","text":"Justice Department release, as reported by CNN and STAT."}],"weight":10},{"id":"hm-2020-report","title":"Harvard Reports Jeffrey Epstein Gifts","publisher":"Harvard Magazine","author":"","date":"2020-05-01","url":"https://www.harvardmagazine.com/2020/05/harvard-report-jeffrey-epstein-gifts","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"F-02","text":"A $6.5 million gift in 2003 established the Program for Evolutionary Dynamics.","state":"Verified implementation","grade":"A1","caveat":"","also":["harvard-2020-report"]},{"key":"F-04","text":"A faculty request to reconsider the decision was declined in 2013.","state":"Verified implementation","grade":"A2","caveat":"","also":[]}],"statements":[{"key":"s1aeupxe","where":"/program-for-evolutionary-dynamics/","text":"Harvard’s review counted $9.1 million in gifts from Epstein to the whole University between 1998 and 2008. After his 2008 conviction, President Drew Faust decided that Harvard would accept nothing further from him, and the review found that it did not. The Program is where the relationship continued in other forms: physical access, a presence on the Program’s website, and gifts from donors he had introduced."},{"key":"s1es0q4b","where":"/program-for-evolutionary-dynamics/ (Timeline: 2003)","text":"A $6.5 million gift establishes the Program. The largest single gift, $6.5 million, founded the Program for Evolutionary Dynamics under Professor Martin Nowak. Its offices were in a private building at One Brattle Square, Harvard Square."},{"key":"s1u92esh","where":"/program-for-evolutionary-dynamics/ (Timeline: 2008)","text":"Florida conviction; Harvard stops accepting his gifts. After Epstein’s 2008 conviction, President Drew Faust decided Harvard would accept no further gifts from him. The review found none were received after that point. A faculty request to revisit the decision was declined in 2013."}],"weight":9},{"id":"raskin-2026","title":"Letter from Ranking Member Jamie Raskin to Harvard President Alan Garber concerning Jeffrey Epstein","publisher":"U.S. House Committee on the Judiciary, Democratic staff","author":"","date":"2026-06-17","url":"https://democrats-judiciary.house.gov/sites/evo-subsites/democrats-judiciary.house.gov/files/evo-media-document/2026-06-17-raskin-to-garber-harvard-re-epstein.pdf","grade":"A1","note":"A primary record of what the letter’s authors assert and request. Its assertions are not findings.","checked":"","namesPeople":true,"claims":[{"key":"R-08","text":"On 17 June 2026 the ranking member of the House Judiciary Committee wrote to Harvard requesting records from 1998 onward.","state":"Documented activity","grade":"A1","caveat":"The letter’s characterisations are assertions by its authors.","also":["crimson-2026-raskin"]},{"key":"D-07","text":"A congressional letter asserts that Harvard development staff knew of and encouraged Epstein’s role in the Black gifts.","state":"Stated intent","grade":"A1","caveat":"An assertion. Harvard has published no finding on it.","also":[]}],"statements":[{"key":"sd6uhqn","where":"/donor-pathways/","text":"Reporting in 2026 from the Justice Department release described further contacts around donations, including a 2014 biotechnology investment venture discussed between Epstein and Professor Church. A June 2026 letter from the ranking member of the House Judiciary Committee asserts that Harvard development staff knew of and encouraged Epstein’s role in the Black gifts. That is an assertion by the letter’s authors. Harvard has not published a finding on it."},{"key":"syybiil","where":"/program-for-evolutionary-dynamics/ (Timeline: 17 June 2026)","text":"Congressional letter requests records. The ranking member of the House Judiciary Committee wrote to Harvard’s president asserting that the University’s earlier review was incomplete and requesting records from 1998 onward. Harvard referred to its ongoing review. No outcome of that review had been published when this page was last reviewed."}],"weight":8},{"id":"crimson-2020-report","title":"Harvard concludes its review of Epstein’s ties to the University","publisher":"The Harvard Crimson","author":"","date":"2020-05-02","url":"https://www.thecrimson.com/article/2020/5/2/harvard-concludes-epstein-review","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"D-03","text":"The donors denied that Epstein directed their gifts, and the review found no evidence that he did.","state":"Verified implementation","grade":"A1","caveat":"","also":["harvard-2020-report"]}],"statements":[{"key":"ss6fxhs","where":"/donor-pathways/","text":"The review recorded that the introduced donors denied Epstein had directed their gifts, and it found no evidence that he had. It also noted that his staff acted as intermediaries on some of them. An introduction is therefore documented. Direction of the money is not."},{"key":"sw2l21f","where":"/program-for-evolutionary-dynamics/","text":"The $9.1 million is the total of Epstein’s gifts to Harvard, all received by 2008. It is not the amount given to this Program, and none of it arrived after the conviction. Some coverage gives the total as $9,179,000 or “nearly $9.2 million”. That figure would round to $9.2 million, so the sources do not simply differ by rounding. This site uses the University’s own “$9.1 million” until the report itself has been checked. The money that reached Professor Nowak’s work after 2008 came from other donors."},{"key":"s1hh5omr","where":"/program-for-evolutionary-dynamics/","text":"The review said he used the visits mainly to meet prominent academics from the Cambridge area. It reported that it “did not find evidence” that he engaged with undergraduate students during the visits or as a Visiting Fellow. That sentence is limited to undergraduates and to what the review could find. The Crimson’s account of the report notes that he attended one of Professor Nowak’s undergraduate classes."},{"key":"s1ivfphj","where":"/program-for-evolutionary-dynamics/ (Timeline: 2010 to 2018)","text":"More than 40 visits; key card, passcode and office key. Harvard’s review could not fix an exact number but understood that Epstein visited the Program’s offices more than 40 times in this period, at least once as late as October 2018. He held a visitor key card, the door passcode and a key to an office the Program informally called “Jeffrey’s Office.” Professor Nowak told reviewers the office was also used by other visitors."},{"key":"spdaxll","where":"/program-for-evolutionary-dynamics/ (Timeline: 2010 to 2015)","text":"Introduced donors give $7.5 million for Nowak’s work. Donors whom Epstein had introduced gave $7.5 million to support Professor Nowak’s work and $2 million to support Professor George Church’s. The donors denied that Epstein directed their gifts, and the review found no evidence that he did."}],"weight":8},{"id":"crimson-2021-nowak","title":"Gay Levies Sanctions Against Prof. Nowak for Contacts With Jeffrey Epstein","publisher":"The Harvard Crimson","author":"","date":"2021-03-26","url":"https://www.thecrimson.com/article/2021/3/26/gay-sanctions-nowak-epstein/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"R-03","text":"In March 2021 the Faculty of Arts and Sciences found policy violations, imposed two-year restrictions and closed the Program.","state":"Verified implementation","grade":"A2","caveat":"","also":["hm-2021-nowak"]}],"statements":[{"key":"sfvk6qn","where":"/program-for-evolutionary-dynamics/","text":"2021 Program closed by the Faculty of Arts and Sciences"},{"key":"sahbc2a","where":"/program-for-evolutionary-dynamics/","text":"March 2021 Policy violations found; two-year restrictions; Program closed"},{"key":"s1gzqd0g","where":"/program-for-evolutionary-dynamics/ (Timeline: March 2021)","text":"Sanctions announced; the Program is closed. Dean Claudine Gay said the review found violations of policies on professional conduct, campus access and endorsements. The Program was to be shut down and Professor Nowak’s research moved into the Mathematics department. For two years he could not lead new grants or take on new advisees. He kept his appointments and continued to teach."},{"key":"s1mav55","where":"/comparison/ (Institutional response; Harvard)","text":"Director placed on leave in 2020 and sanctioned in 2021; program closed; sanctions lifted in 2023; second leave in 2026."}],"weight":7},{"id":"axios-2020-black","title":"“The Leon Black route” at Harvard","publisher":"Axios","author":"","date":"2020-05-07","url":"https://www.axios.com/2020/05/07/jeffery-epstein-leon-black-route-harvard","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"D-04","text":"About $7 million of the gifts for Martin Nowak’s work came from Leon Black, his wife and their family foundation.","state":"Verified implementation","grade":"A2","caveat":"Whether the report itself names the donors must be confirmed in the PDF.","also":[]},{"key":"D-05","text":"A representative of Leon Black confirmed the introduction and said the funds were not provided by Epstein.","state":"Verified implementation","grade":"A2","caveat":"","also":[]}],"statements":[{"key":"s1ljsj24","where":"/donor-pathways/","text":"The clearest example in the record is the financier Leon Black. Reporting on the 2020 review attributes $7 million in unrestricted gifts for Professor Nowak’s work to Mr Black, his wife and their family foundation between 2011 and 2015. That $7 million sits inside the review’s $7.5 million total for all introduced donors to Professor Nowak. A representative confirmed that Epstein introduced Mr Black to the research and said the funds were not provided by Epstein."}],"weight":7},{"id":"stat-2026-mystery","title":"A new mystery emerges about Epstein’s involvement in Harvard genetics study","publisher":"STAT","author":"","date":"2026-03-04","url":"https://www.statnews.com/2026/03/04/jeffrey-epstein-new-mystery-harvard-genetics-project-george-church/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"G-02","text":"Cell lines containing Epstein’s DNA were created in 2013; their present whereabouts are unknown.","state":"Documented activity","grade":"A2","caveat":"Single outlet.","also":[]}],"statements":[{"key":"s16y7udp","where":"/dna-genetics/","text":"Cell lines from a tissue sample 2013 Created within a research study in which he was enrolled as a subject; current whereabouts unknown."},{"key":"sd6xrdo","where":"/harvard-medical-school/","text":"A follow-up reported that cell lines containing Epstein’s DNA were created in 2013, that the present whereabouts of those cells are unknown, and that the consent date on the study profile believed to be his was altered on 31 January 2026 by a person not identified. These points rest on one outlet’s reporting and are graded accordingly."},{"key":"sytca56","where":"/harvard-medical-school/ (Timeline: 2013)","text":"Tissue sample and a dispute in the lab. STAT reported that a push to move one person’s sample ahead of others waiting for sequencing caused an uproar in the Church lab when the person was identified as Epstein, and that internal objections stopped any special treatment. Cell lines were derived from the sample that year. Professor Church confirmed the episode and said he had not personally pushed for special treatment."},{"key":"s1mqwl3o","where":"/comparison/ (DNA activity; Harvard Medical School)","text":"Cell lines derived in 2013; exome and fibroblast sequencing invoiced in 2014. Larger proposals not carried out."}],"weight":7},{"id":"source-2022-settlement","title":"V.I. Government Settles Epstein Suit for Record $105 Million","publisher":"St. John Source","author":"","date":"2022-11-30","url":"https://stjohnsource.com/2022/11/30/v-i-government-settles-epstein-suit-for-record-105-million/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"V-01","text":"In November 2012 Southern Trust Company was described to a tax-incentive commission as consulting in “biomedical and financial informatics.”","state":"Stated intent","grade":"A2","caveat":"","also":[]},{"key":"V-02","text":"The company received a ten-year package of tax incentives in 2013.","state":"Documented activity","grade":"A2","caveat":"","also":[]}],"statements":[{"key":"sipaelv","where":"/dna-genetics/","text":"In November 2012 Epstein and his lawyer appeared before the U.S. Virgin Islands Economic Development Commission and described Southern Trust Company as providing consulting in “biomedical and financial informatics.” In 2013 the company received a ten-year package of tax incentives."}],"weight":7},{"id":"crimson-2026-probe","title":"Harvard expands its Epstein review","publisher":"The Harvard Crimson","author":"","date":"2026-02-11","url":"https://www.thecrimson.com/article/2026/2/11/harvard-expands-epstein-probe/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"R-05","text":"Harvard opened a new review in November 2025 and widened it in February 2026 to donors and faculty named in released records.","state":"Documented activity","grade":"A2","caveat":"No findings had been published when last reviewed.","also":["crimson-2025-review","hm-2026-probe"]}],"statements":[{"key":"srb1ahj","where":"/program-for-evolutionary-dynamics/ (Timeline: January to February 2026)","text":"Justice Department release; review widened. A large Department of Justice release followed. Reporters found Professor Nowak’s name in more than 4,000 search results in the released database; that is a count of search hits, not of distinct messages. Harvard widened its review to donors and faculty named in the new records."},{"key":"sqvxze9","where":"/harvard-medical-school/ (Timeline: February to March 2026)","text":"Document release and new reporting. CNN, STAT and the Boston Globe reported on emails in the Justice Department release. Harvard’s widened review covers faculty named in the documents. No disciplinary finding concerning Professor Church or Dr Thakuria was located."},{"key":"s1ysgz3k","where":"/comparison/ (Institutional response; Harvard Medical School)","text":"Public apology by Professor Church in 2019; covered by Harvard’s widened 2026 review; no finding published."}],"weight":6},{"id":"crimson-2026-hms-rating","title":"Harvard Promised a “Full” Review of Its Epstein Ties. Its Own Files Reveal What It Left Out.","publisher":"The Harvard Crimson, with Pablo Torre Finds Out","author":"","date":"2026-05-01","url":"https://www.thecrimson.com/article/2026/5/1/epstein-harvard-hms-rating/","grade":"A2","note":"Single-outlet reporting on a donor capacity rating in Harvard’s development records. Harvard declined to comment.","checked":"","namesPeople":true,"claims":[{"key":"D-08","text":"Harvard Medical School’s development records generated a $75 million “active” donor rating for Epstein in July 2012.","state":"Documented activity","grade":"A2","caveat":"A capacity estimate, not a gift, pledge or solicitation. Single outlet. Harvard declined to comment.","also":[]}],"statements":[{"key":"s1cv6ftr","where":"/comparison/","text":"Both institutional reports were written before the 2026 document release. Each university has since faced reporting that its review was incomplete, and Harvard’s second review had not reported when this page was last checked."},{"key":"scbo965","where":"/harvard-medical-school/","text":"In May 2026 the Crimson reported that Harvard Medical School’s development system generated a $75 million “active” donor rating for Epstein in July 2012, four years after Harvard had stopped accepting his gifts, and that the rating did not appear in the 2020 report. A rating of this kind is an estimate of giving capacity. It does not show that a gift was sought or received. The report rests on a single outlet, and Harvard declined to comment."},{"key":"szzidqs","where":"/harvard-medical-school/ (Timeline: July 2012)","text":"A $75 million donor capacity rating. The Crimson reported that Harvard Medical School’s development records generated a $75 million “active” donor rating for Epstein. A capacity rating estimates what a person could give. It is not a pledge, a gift or a solicitation. Harvard declined to comment."}],"weight":6},{"id":"crimson-2026-nowak-leave","title":"Harvard Places Math Professor Martin Nowak on Paid Administrative Leave Over Epstein Ties","publisher":"The Harvard Crimson","author":"","date":"2026-02-25","url":"https://www.thecrimson.com/article/2026/2/25/nowak-leave-epstein/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"R-06","text":"Martin Nowak was placed on paid administrative leave a second time in late February 2026.","state":"Documented activity","grade":"A2","caveat":"He is not accused of a crime. Sources differ by a day on the date. Outcome not published.","also":["hm-2026-nowak"]}],"statements":[{"key":"sf4mv1l","where":"/program-for-evolutionary-dynamics/","text":"February 2026 Second paid leave pending a formal investigation; outcome not published"},{"key":"s7rc770","where":"/program-for-evolutionary-dynamics/ (Timeline: Late February 2026)","text":"Nowak placed on paid leave a second time. The Faculty of Arts and Sciences cited new information from the released documents and a recommendation for a formal investigation into possible policy violations. The reasons were not made public in detail, and he is not accused of a crime. In statements to reporters he has said he had no knowledge of Epstein’s crimes and regrets the connection."},{"key":"s1mav55","where":"/comparison/ (Institutional response; Harvard)","text":"Director placed on leave in 2020 and sanctioned in 2021; program closed; sanctions lifted in 2023; second leave in 2026."}],"weight":6},{"id":"tech-2026-mit","title":"Newly released emails and MIT’s 2020 Epstein investigation","publisher":"The Tech (MIT)","author":"","date":"2026-02-19","url":"https://thetech.com/2026/02/19/epstein-mit-26-gates-black","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"M-06","text":"In 2026 MIT’s student newspaper reported donor connections that the 2020 review had not covered.","state":"Documented activity","grade":"A2","caveat":"","also":[]}],"statements":[{"key":"s1cv6ftr","where":"/comparison/","text":"Both institutional reports were written before the 2026 document release. Each university has since faced reporting that its review was incomplete, and Harvard’s second review had not reported when this page was last checked."},{"key":"s1w72juz","where":"/donor-pathways/","text":"The Media Lab’s director, Joi Ito, resigned in September 2019. Professor Lloyd was placed on paid leave and later disciplined, and continued to teach. In 2026, MIT’s student newspaper reported that the newly released emails pointed to donor connections the 2020 review had not covered."},{"key":"s1q46y2j","where":"/comparison/ (Funding from introduced donors; MIT)","text":"Not addressed in the 2020 report’s findings; raised by 2026 reporting."}],"weight":6},{"id":"hm-2026-nowak","title":"Martin Nowak Placed on Leave a Second Time","publisher":"Harvard Magazine","author":"","date":"2026-02","url":"https://www.harvardmagazine.com/university-news/martin-nowak-harvard-administrative-leave-epstein","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"R-06","text":"Martin Nowak was placed on paid administrative leave a second time in late February 2026.","state":"Documented activity","grade":"A2","caveat":"He is not accused of a crime. Sources differ by a day on the date. Outcome not published.","also":["crimson-2026-nowak-leave"]}],"statements":[{"key":"s67pzwj","where":"/program-for-evolutionary-dynamics/","text":"Professor Nowak is not accused of a crime. He has said he did not know of Epstein’s crimes and regrets the connection."},{"key":"s7rc770","where":"/program-for-evolutionary-dynamics/ (Timeline: Late February 2026)","text":"Nowak placed on paid leave a second time. The Faculty of Arts and Sciences cited new information from the released documents and a recommendation for a formal investigation into possible policy violations. The reasons were not made public in detail, and he is not accused of a crime. In statements to reporters he has said he had no knowledge of Epstein’s crimes and regrets the connection."}],"weight":5},{"id":"hm-2026-probe","title":"Harvard’s Epstein Probe Widened","publisher":"Harvard Magazine","author":"","date":"2026-02","url":"https://www.harvardmagazine.com/university-news/harvard-epstein-probe-donors","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"R-05","text":"Harvard opened a new review in November 2025 and widened it in February 2026 to donors and faculty named in released records.","state":"Documented activity","grade":"A2","caveat":"No findings had been published when last reviewed.","also":["crimson-2025-review","crimson-2026-probe"]}],"statements":[{"key":"s1xptumz","where":"/","text":"Jeffrey Epstein was convicted in Florida in 2008. Harvard stopped taking his money that year. Its own 2020 review found that he nonetheless kept physical access to a research program he had funded, visited it dozens of times, and introduced other donors whose gifts reached the same faculty. A large Department of Justice document release in early 2026 added detail and prompted Harvard to reopen and widen its review."},{"key":"srb1ahj","where":"/program-for-evolutionary-dynamics/ (Timeline: January to February 2026)","text":"Justice Department release; review widened. A large Department of Justice release followed. Reporters found Professor Nowak’s name in more than 4,000 search results in the released database; that is a count of search hits, not of distinct messages. Harvard widened its review to donors and faculty named in the new records."}],"weight":5},{"id":"ihe-2026-names","title":"Even More Higher Ed Names in the Epstein Files","publisher":"Inside Higher Ed","author":"","date":"2026-02-05","url":"https://www.insidehighered.com/news/faculty/2026/02/05/even-more-higher-ed-names-epstein-files","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"A-07","text":"Martin Nowak’s name returns more than 4,000 results in the Justice Department’s released database.","state":"Documented activity","grade":"A2","caveat":"A count of search hits, including duplicates. Not a count of messages.","also":[]}],"statements":[{"key":"s1lcf1jp","where":"/program-for-evolutionary-dynamics/","text":"After the 2026 Justice Department release, reporters searching the public database found Professor Nowak’s name in more than 4,000 results. Outlets describe the unit differently (documents, results, appearances), and search hits include duplicates and forwarded threads. The number shows that contact was frequent. It is not a count of messages, and it says nothing by itself about their content."},{"key":"srb1ahj","where":"/program-for-evolutionary-dynamics/ (Timeline: January to February 2026)","text":"Justice Department release; review widened. A large Department of Justice release followed. Reporters found Professor Nowak’s name in more than 4,000 search results in the released database; that is a count of search hits, not of distinct messages. Harvard widened its review to donors and faculty named in the new records."}],"weight":5},{"id":"globe-2026-spotlight","title":"Jeffrey Epstein and Harvard (Spotlight report)","publisher":"The Boston Globe","author":"","date":"2026-02-25","url":"https://www.bostonglobe.com/2026/02/25/metro/jeffrey-epstein-harvard-spotlight-report/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"D-09","text":"Reporting describes a 2014 biotechnology investment venture discussed between Epstein and George Church.","state":"Stated intent","grade":"A2","caveat":"","also":["cnn-2026-donations"]}],"statements":[{"key":"sd6uhqn","where":"/donor-pathways/","text":"Reporting in 2026 from the Justice Department release described further contacts around donations, including a 2014 biotechnology investment venture discussed between Epstein and Professor Church. A June 2026 letter from the ranking member of the House Judiciary Committee asserts that Harvard development staff knew of and encouraged Epstein’s role in the Black gifts. That is an assertion by the letter’s authors. Harvard has not published a finding on it."},{"key":"sqvxze9","where":"/harvard-medical-school/ (Timeline: February to March 2026)","text":"Document release and new reporting. CNN, STAT and the Boston Globe reported on emails in the Justice Department release. Harvard’s widened review covers faculty named in the documents. No disciplinary finding concerning Professor Church or Dr Thakuria was located."}],"weight":5},{"id":"sfgate-2026-kits","title":"Jeffrey Epstein’s assistant ordered so many 23andMe kits, the company asked why","publisher":"SFGate","author":"","date":"2026","url":"https://www.sfgate.com/bayarea/article/epstein-assistant-23andme-21331634.php","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"G-08","text":"In summer 2017 an assistant placed a bulk 23andMe order that, according to the correspondence, was for colleagues of Sultan Ahmed bin Sulayem; the company queried it and cancelled it.","state":"Documented activity","grade":"A2","caveat":"Accounts differ on the number of kits and on what became of them.","also":[]}],"statements":[{"key":"s119ulhc","where":"/dna-genetics/","text":"Bulk 23andMe order for colleagues of Sultan Ahmed bin Sulayem Summer 2017 An order placed by an assistant; the company queried its size and cancelled it under its U.S.-use terms."},{"key":"s17s8zhq","where":"/dna-genetics/","text":"In summer 2017 an assistant, Lesley Groff, placed a much larger order connected to Sultan Ahmed bin Sulayem and explained that he wanted kits for colleagues. 23andMe’s support staff questioned the volume and cancelled the order because its terms required use in the United States. Later correspondence says kits were nonetheless put on a flight to Dubai. Accounts differ on the size of the order, from “over two dozen” to thirty kits costing a little over $6,000."}],"weight":5},{"id":"nyt-2019-seed","title":"Jeffrey Epstein Hoped to Seed Human Race With His DNA","publisher":"The New York Times","author":"James B. Stewart, Matthew Goldstein and Jessica Silver-Greenberg","date":"2019-07-31","url":"https://www.nytimes.com/2019/07/31/business/jeffrey-epstein-eugenics.html","grade":"A2","note":"The reporting is graded A2. The account it relays from Jaron Lanier is second-hand and is treated on this site as B2.","checked":"","namesPeople":true,"claims":[{"key":"G-09","text":"Epstein told people of a wish to have women inseminated at his New Mexico ranch.","state":"Stated intent","grade":"B2","caveat":"The fullest account is second-hand. The newspaper reported no evidence the idea was acted on.","also":[]}],"statements":[{"key":"s1yqu8f0","where":"/dna-genetics/","text":"Zorro Ranch insemination idea Early 2000s onward Reported as something he told people. The fullest account is second-hand. The Times reported no evidence it was acted on."},{"key":"s427lct","where":"/dna-genetics/","text":"In July 2019 the New York Times reported that Epstein had told scientists and others of a wish to have women inseminated at his New Mexico ranch. The most specific version came from the author Jaron Lanier, who was relaying what a scientist had told him at a dinner. He did not hear it from Epstein. The Times reported that there was no evidence the idea came to anything."}],"weight":5},{"id":"mit-2020-lloyd","title":"Decision on Professor Seth Lloyd","publisher":"MIT, Office of the Provost","author":"Martin A. Schmidt","date":"2020-12-18","url":"https://orgchart.mit.edu/letters/decision-professor-seth-lloyd","grade":"A1","note":"","checked":"","namesPeople":true,"claims":[{"key":"M-05","text":"The Media Lab’s director resigned in September 2019; Seth Lloyd was placed on leave, later disciplined, and continued to teach.","state":"Verified implementation","grade":"A1","caveat":"","also":[]}],"statements":[{"key":"s1w72juz","where":"/donor-pathways/","text":"The Media Lab’s director, Joi Ito, resigned in September 2019. Professor Lloyd was placed on paid leave and later disciplined, and continued to teach. In 2026, MIT’s student newspaper reported that the newly released emails pointed to donor connections the 2020 review had not covered."},{"key":"s7rfz6e","where":"/comparison/ (Institutional response; MIT)","text":"Lab director resigned in 2019; Professor Lloyd disciplined in 2020 and continued teaching."}],"weight":5},{"id":"techreview-2020-mit","title":"Eight revelations from MIT’s Jeffrey Epstein report","publisher":"MIT Technology Review","author":"","date":"2020-01-10","url":"https://www.technologyreview.com/2020/01/10/130928/mit-jeffrey-epstein-donations-media-lab-joi-ito-seth-lloyd-funding-ethics/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"M-03","text":"Three vice-presidents learned of the gifts in 2013 and allowed them to continue on informal conditions, including anonymity.","state":"Verified implementation","grade":"A1","caveat":"","also":["mit-2020-report"]}],"statements":[{"key":"sgo0pz3","where":"/donor-pathways/","text":"MIT’s commissioned review, by the law firm Goodwin Procter, found a different route to a similar end. MIT did take Epstein’s money after his conviction: of ten gifts totalling $850,000 between 2002 and 2017, nine came after 2008, $525,000 to the Media Lab and $225,000 to Professor Seth Lloyd. Three vice-presidents learned of the gifts in 2013 and allowed them to continue on informal conditions, including anonymity. He visited the campus nine times between 2013 and 2017."},{"key":"sel9hr4","where":"/comparison/ (Funding before the 2008 conviction; MIT)","text":"One gift of $100,000 in 2002."}],"weight":5},{"id":"hm-2021-nowak","title":"Martin Nowak Sanctioned for Jeffrey Epstein Involvement","publisher":"Harvard Magazine","author":"","date":"2021-03","url":"https://www.harvardmagazine.com/2021/03/martin-nowak-sanctioned-for-jeffrey-epstein-involvement","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"R-03","text":"In March 2021 the Faculty of Arts and Sciences found policy violations, imposed two-year restrictions and closed the Program.","state":"Verified implementation","grade":"A2","caveat":"","also":["crimson-2021-nowak"]}],"statements":[{"key":"s1gzqd0g","where":"/program-for-evolutionary-dynamics/ (Timeline: March 2021)","text":"Sanctions announced; the Program is closed. Dean Claudine Gay said the review found violations of policies on professional conduct, campus access and endorsements. The Program was to be shut down and Professor Nowak’s research moved into the Mathematics department. For two years he could not lead new grants or take on new advisees. He kept his appointments and continued to teach."}],"weight":4},{"id":"crimson-2026-nowak-academy","title":"Nowak resigns from the Austrian Academy of Sciences","publisher":"The Harvard Crimson","author":"","date":"2026-04-02","url":"https://www.thecrimson.com/article/2026/4/2/nowak-austrian-academy-resignation/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"R-07","text":"Martin Nowak resigned from the Austrian Academy of Sciences in spring 2026.","state":"Documented activity","grade":"A2","caveat":"","also":[]}],"statements":[{"key":"s14894u6","where":"/program-for-evolutionary-dynamics/ (Timeline: Spring 2026)","text":"Resignation from the Austrian Academy of Sciences. Professor Nowak resigned his membership before the Academy’s ethics process concluded."}],"weight":4},{"id":"crimson-2025-review","title":"Harvard To Launch New Investigation Into Epstein’s Ties to Summers, Other University Affiliates","publisher":"The Harvard Crimson","author":"","date":"2025-11-19","url":"https://www.thecrimson.com/article/2025/11/19/harvard-opens-investigation-into-summers-epstein/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"R-05","text":"Harvard opened a new review in November 2025 and widened it in February 2026 to donors and faculty named in released records.","state":"Documented activity","grade":"A2","caveat":"No findings had been published when last reviewed.","also":["crimson-2026-probe","hm-2026-probe"]}],"statements":[{"key":"s1ycdus7","where":"/program-for-evolutionary-dynamics/ (Timeline: November 2025)","text":"Harvard opens a new review. After a congressional committee released Epstein emails, Harvard said it would review the ties of University affiliates named in the documents."}],"weight":4},{"id":"hks-2018-black","title":"$7.5 million gift from the Debra and Leon Black Family Foundation to support U.S. military and veteran fellowships","publisher":"Harvard Kennedy School","author":"","date":"2018-10","url":"https://www.hks.harvard.edu/announcements/75-million-gift-debra-and-leon-black-family-foundation-support-us-military-and","grade":"A1","note":"Cited to record that this gift exists and that no public record connects it to Epstein.","checked":"","namesPeople":true,"claims":[{"key":"D-06","text":"The Black family foundation’s 2018 gift of $7.5 million for military and veteran fellowships has no public documented connection to Epstein.","state":"Nothing on record","grade":"A1","caveat":"A statement of absence. The gift itself is documented by the school’s announcement.","also":[]}],"statements":[{"key":"swkwc6g","where":"/donor-pathways/","text":"The $7.5 million in Harvard’s review is the sum given by all introduced donors for Professor Nowak’s work. Separately, in 2018 the Debra and Leon Black Family Foundation gave $7.5 million to fund fellowships for veterans and serving military at Harvard Kennedy School and other Harvard schools. We found no public record connecting the fellowship gift to Epstein, and this site does not treat it as part of the introduced-donor pathway."}],"weight":4},{"id":"cnn-2026-donations","title":"Harvard, Epstein and donor influence (CNN exclusive)","publisher":"CNN","author":"","date":"2026-02-19","url":"https://www.cnn.com/2026/02/19/politics/harvard-epstein-donations-influence-exclusive","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"D-09","text":"Reporting describes a 2014 biotechnology investment venture discussed between Epstein and George Church.","state":"Stated intent","grade":"A2","caveat":"","also":["globe-2026-spotlight"]}],"statements":[{"key":"sd6uhqn","where":"/donor-pathways/","text":"Reporting in 2026 from the Justice Department release described further contacts around donations, including a 2014 biotechnology investment venture discussed between Epstein and Professor Church. A June 2026 letter from the ranking member of the House Judiciary Committee asserts that Harvard development staff knew of and encouraged Epstein’s role in the Black gifts. That is an assertion by the letter’s authors. Harvard has not published a finding on it."}],"weight":4},{"id":"hm-2019-dominguez","title":"Jorge Domínguez Loses Emeritus Status","publisher":"Harvard Magazine","author":"","date":"2019-05","url":"https://www.harvardmagazine.com/2019/05/jorge-dom-nguez-loses-emeritus-status","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"S-06","text":"In May 2019 Harvard announced that a Title IX investigation had found unwelcome sexual conduct by Jorge Domínguez over nearly four decades, and revoked his emeritus status.","state":"Verified implementation","grade":"A2","caveat":"His own public response must be added from the cited reporting.","also":[]}],"statements":[{"key":"s1h5640e","where":"/campus-safety/","text":"In February 2018 the Chronicle of Higher Education reported allegations of sexual harassment against Professor Domínguez spanning decades, and that Harvard had disciplined him for misconduct in 1983. He was placed on leave and retired. In May 2019 the Faculty of Arts and Sciences announced that a Title IX investigation had found unwelcome sexual conduct toward several individuals over nearly four decades. It revoked his emeritus status and barred him from the campus. His own public responses are recorded in the cited reporting."}],"weight":4},{"id":"harvard-2022-statement","title":"Harvard statements (10 February 2022)","publisher":"Harvard University, Media Relations","author":"","date":"2022-02-10","url":"https://www.harvard.edu/media-relations/2022/02/10/harvard-statements/","grade":"A1","note":"","checked":"","namesPeople":true,"claims":[{"key":"S-11","text":"In January 2022 Harvard placed John Comaroff on unpaid leave after reviews found verbal conduct violating its policies. He has denied the allegations.","state":"Verified implementation","grade":"A1","caveat":"","also":["crimson-2022-comaroff"]}],"statements":[{"key":"s2uud2c","where":"/campus-safety/","text":"In January 2022 Harvard placed Professor Comaroff on unpaid leave and restricted his teaching and advising after internal reviews found that he had engaged in verbal conduct that violated its sexual harassment and professional conduct policies. He has denied the allegations against him."}],"weight":4},{"id":"crimson-2022-comaroff","title":"Comaroff placed on unpaid leave","publisher":"The Harvard Crimson","author":"","date":"2022-01-21","url":"https://www.thecrimson.com/article/2022/1/21/comaroff-unpaid-leave","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"S-11","text":"In January 2022 Harvard placed John Comaroff on unpaid leave after reviews found verbal conduct violating its policies. He has denied the allegations.","state":"Verified implementation","grade":"A1","caveat":"","also":["harvard-2022-statement"]}],"statements":[{"key":"s2uud2c","where":"/campus-safety/","text":"In January 2022 Harvard placed Professor Comaroff on unpaid leave and restricted his teaching and advising after internal reviews found that he had engaged in verbal conduct that violated its sexual harassment and professional conduct policies. He has denied the allegations against him."}],"weight":4},{"id":"crimson-2024-comaroff-suit","title":"Harvard settles lawsuit over its handling of complaints against John Comaroff","publisher":"The Harvard Crimson","author":"","date":"2024-08-15","url":"https://www.thecrimson.com/article/2024/8/15/harvard-settles-comaroff-lawsuit","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"S-12","text":"A lawsuit by three graduate students against the University ended in August 2024 with a voluntary dismissal after mediation, without a ruling on the merits.","state":"Verified implementation","grade":"A2","caveat":"Settlement terms undisclosed. John Comaroff was not a defendant.","also":[]}],"statements":[{"key":"s1y4p7uc","where":"/campus-safety/","text":"In February 2022 three graduate students sued the University in federal court, alleging that it had ignored years of complaints. Professor Comaroff was not a defendant. The court largely declined to dismiss the case in 2023. It ended in August 2024 with a voluntary dismissal after mediation, on undisclosed terms, and without any ruling on the merits. He retired in June 2024."}],"weight":4},{"id":"crimson-2024-comaroff-retires","title":"John Comaroff retires without emeritus status","publisher":"The Harvard Crimson","author":"","date":"2024-08-02","url":"https://www.thecrimson.com/article/2024/8/2/john-comaroff-retires-without-emeritus-status","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"S-13","text":"John Comaroff retired in June 2024.","state":"Verified implementation","grade":"A2","caveat":"","also":[]}],"statements":[{"key":"s1y4p7uc","where":"/campus-safety/","text":"In February 2022 three graduate students sued the University in federal court, alleging that it had ignored years of complaints. Professor Comaroff was not a defendant. The court largely declined to dismiss the case in 2023. It ended in August 2024 with a voluntary dismissal after mediation, on undisclosed terms, and without any ruling on the merits. He retired in June 2024."}],"weight":4},{"id":"gay-2019-fryer","title":"Letter from Dean Claudine Gay concerning Professor Roland Fryer","publisher":"Harvard Faculty of Arts and Sciences (copy hosted by WBUR)","author":"","date":"2019-07-10","url":"https://media.wbur.org/wp/2019/07/Gay_letter.pdf","grade":"A1","note":"","checked":"","namesPeople":true,"claims":[{"key":"S-09","text":"In July 2019 Roland Fryer was placed on administrative leave for two years and his lab was closed. He denied discrimination or harassment.","state":"Verified implementation","grade":"A1","caveat":"Confirm the wording of the findings from the Dean’s letter.","also":["hm-2019-fryer"]}],"statements":[{"key":"sy47ict","where":"/campus-safety/","text":"In July 2019 the Dean of the Faculty of Arts and Sciences announced that, following complaints of unwelcome sexual conduct in his research lab, Professor Fryer would be placed on administrative leave for two years, his lab would close, and conditions would apply on his return. He denied engaging in discrimination or harassment. He returned to teaching and research in 2021 under conditions."}],"weight":4},{"id":"hm-2019-fryer","title":"Harvard Sanctions Economist Roland Fryer","publisher":"Harvard Magazine","author":"","date":"2019-07","url":"https://www.harvardmagazine.com/2019/07/harvard-sanctions-economist-roland-fryer","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"S-09","text":"In July 2019 Roland Fryer was placed on administrative leave for two years and his lab was closed. He denied discrimination or harassment.","state":"Verified implementation","grade":"A1","caveat":"Confirm the wording of the findings from the Dean’s letter.","also":["gay-2019-fryer"]}],"statements":[{"key":"sy47ict","where":"/campus-safety/","text":"In July 2019 the Dean of the Faculty of Arts and Sciences announced that, following complaints of unwelcome sexual conduct in his research lab, Professor Fryer would be placed on administrative leave for two years, his lab would close, and conditions would apply on his return. He denied engaging in discrimination or harassment. He returned to teaching and research in 2021 under conditions."}],"weight":4},{"id":"crimson-2021-fryer","title":"Fryer returns to teaching and research","publisher":"The Harvard Crimson","author":"","date":"2021-07-07","url":"https://www.thecrimson.com/article/2021/7/7/fryer-returns-from-suspension/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[{"key":"S-10","text":"Roland Fryer returned to teaching and research in 2021 under conditions.","state":"Verified implementation","grade":"A2","caveat":"","also":[]}],"statements":[{"key":"sy47ict","where":"/campus-safety/","text":"In July 2019 the Dean of the Faculty of Arts and Sciences announced that, following complaints of unwelcome sexual conduct in his research lab, Professor Fryer would be placed on administrative leave for two years, his lab would close, and conditions would apply on his return. He denied engaging in discrimination or harassment. He returned to teaching and research in 2021 under conditions."}],"weight":4},{"id":"chronicle-2018-dominguez","title":"She Left Harvard. He Got to Stay.","publisher":"The Chronicle of Higher Education","author":"","date":"2018-02","url":"https://www.chronicle.com/article/she-left-harvard-he-got-to-stay/","grade":"A2","note":"","checked":"","namesPeople":true,"claims":[],"statements":[{"key":"s1h5640e","where":"/campus-safety/","text":"In February 2018 the Chronicle of Higher Education reported allegations of sexual harassment against Professor Domínguez spanning decades, and that Harvard had disciplined him for misconduct in 1983. He was placed on leave and retired. In May 2019 the Faculty of Arts and Sciences announced that a Title IX investigation had found unwelcome sexual conduct toward several individuals over nearly four decades. It revoked his emeritus status and barred him from the campus. His own public responses are recorded in the cited reporting."}],"weight":1},{"id":"gina-statute","title":"Genetic Information Nondiscrimination Act of 2008, Pub. L. 110-233; Title II at 42 U.S.C. § 2000ff et seq.","publisher":"U.S. Equal Employment Opportunity Commission (statute text)","author":"","date":"2008-05-21","url":"https://www.eeoc.gov/statutes/genetic-information-nondiscrimination-act-2008","grade":"A1","note":"","checked":"","namesPeople":false,"claims":[{"key":"L-01","text":"GINA bars health insurers and employers with fifteen or more employees from using genetic information in coverage or employment decisions.","state":"Verified implementation","grade":"A1","caveat":"","also":[]},{"key":"L-03","text":"No source reviewed alleges a GINA violation in connection with this material.","state":"Nothing on record","grade":"A1","caveat":"A statement of absence.","also":[]}],"statements":[{"key":"s19mq5wk","where":"/dna-genetics/","text":"The Genetic Information Nondiscrimination Act of 2008 bars health insurers and employers with fifteen or more employees from using genetic information in coverage or employment decisions. It does not extend to life, disability or long-term-care ins const keysOf=s=>[...s.claims.map(c=>c.key),...s.statements.map(x=>x.key)];
function status(s){const r=saved.sources[s.id];if(s.checked&&!r)return'done';if(!r)return'open';const ks=keysOf(s);
